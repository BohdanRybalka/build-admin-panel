version: '3.8'
services:
  mongo:
    image: mongo:6.0
    container_name: diploma-mongo
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: ConstructionExpenseManagement
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/ConstructionExpenseManagement --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  server:
    build:
      context: ./server
    container_name: diploma-server
    restart: always
    ports:
      - '4000:4000'
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017/ConstructionExpenseManagement
      JWT_SECRET_KEY: V3ryC0mpl3xS3cr3tK3yTh4t1sH4rdT0Gu3ss
      PORT: 4000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000', (r) => {process.exit(r.statusCode === 200 || r.statusCode === 404 ? 0 : 1);})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diploma-client
    restart: always
    ports:
      - '3000:80'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:
