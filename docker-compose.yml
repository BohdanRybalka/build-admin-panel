version: '3.8'
services:
  mongo:
    image: mongo:6.0
    container_name: diploma-mongo
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: ConstructionExpenseManagement
    volumes:
      - mongo_data:/data/db
  server:
    build:
      context: ./server
    container_name: diploma-server
    restart: always
    ports:
      - '4000:4000'
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017/ConstructionExpenseManagement
    volumes:
      - ./server:/usr/src/app
volumes:
  mongo_data:
